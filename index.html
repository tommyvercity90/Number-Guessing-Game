
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🎯 Number Guessing Game</h1>

        <p class="description">
            Guess the secret number between 1 and 100!
        </p>

        <form id="guessForm">
            <label for="guessInput">Enter your guess:</label>

            <input
                type="number"
                id="guessInput"
                min="1"
                max="100"
                placeholder="Enter a number"
                required
            >

            <button type="submit" id="guessButton">
                Check Guess
            </button>
        </form>

        <p id="message" aria-live="polite">
            Good luck! Make your first guess.
        </p>

        <div class="stats">
            <p>Attempts: <span id="attempts">0</span></p>
            <p>Range: 1 - 100</p>
        </div>

        <button id="playAgain" class="play-again" hidden>
            Play Again ↻
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
